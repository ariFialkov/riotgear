name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/keen-thompson-z132xr]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (served from /<repo>/)
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - run: touch dist/.nojekyll
      # Publishes dist/ to the gh-pages branch; GitHub Pages serves it at https://<owner>.github.io/<repo>/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
